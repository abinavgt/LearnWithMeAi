[project]
name = "agenticai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abinav", email = "abinav191510@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.4",
    "ipykernel>=7.4.0",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.4.3",
    "langchain-google-vertexai>=3.2.5",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agenticai = "agenticai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
